<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Product list</title>
</head>
<body>
<h1> This is product list</h1>
<table>
  <thead>
  <td>id</td>
  <td>title</td>
  <td>price</td>
  </thead>
  <tbody>
  <tr th:each="product : ${products}">
    <td th:text="${product.id}"></td>
    <td th:text="${product.title}"></td>
    <td th:text="${product.cost}"></td>
  </tr>
  </tbody>
</table>
</body>
</html>
