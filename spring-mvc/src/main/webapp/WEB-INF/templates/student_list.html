<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student list</title>
</head>
<body>
 <h1> This is student list</h1>
<table>
    <thead>
    <td>id</td>
    <td>Name</td>
    <td>Average score</td>
    </thead>
    <tbody>
    <tr th:each="student : ${students}">
        <td th:text="${student.id}"></td>
        <td th:text="${student.name}"></td>
        <td th:text="${student.score}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
